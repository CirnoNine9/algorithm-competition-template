name: Deploy offline site to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (leave empty for latest)
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
              tag="$RELEASE_TAG"
          elif [[ -n "$INPUT_TAG" ]]; then
              tag="$INPUT_TAG"
          else
              tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          fi
          [[ -n "$tag" ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download offline site
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p download _site
          gh release download "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'algorithm-competition-template-offline-web-*.zip' \
              --dir download
          mapfile -t archives < <(find download -maxdepth 1 -type f \
              -name 'algorithm-competition-template-offline-web-*.zip')
          [[ "${#archives[@]}" -eq 1 ]]
          unzip -q "${archives[0]}" -d _site
          test -f _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
